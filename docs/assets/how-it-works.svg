<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Luồng hoạt động của Codex Usage Manager</title>
  <desc id="desc">Trình duyệt local giao tiếp với Next.js, Codex App Server và các Codex Home cô lập.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="1" stop-color="#102f66"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172b52"/>
      <stop offset="1" stop-color="#0d1d3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity=".55"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4fd1ff"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <g opacity=".22" stroke="#4f9cff">
    <path d="M0 55H1200M0 285H1200"/>
    <circle cx="64" cy="55" r="4" fill="#4fd1ff"/>
    <circle cx="1136" cy="285" r="4" fill="#4fd1ff"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="45" fill="#ffffff" font-size="24" font-weight="700">Dữ liệu đi đâu?</text>
    <text x="600" y="72" fill="#a9c7ee" font-size="14">Mọi thứ chạy trên máy của bạn, qua kết nối nội bộ</text>

    <g filter="url(#shadow)">
      <rect x="55" y="108" width="220" height="150" rx="20" fill="url(#card)" stroke="#2f6fca"/>
      <rect x="340" y="108" width="220" height="150" rx="20" fill="url(#card)" stroke="#2f6fca"/>
      <rect x="625" y="108" width="220" height="150" rx="20" fill="url(#card)" stroke="#2f6fca"/>
      <rect x="910" y="108" width="235" height="150" rx="20" fill="url(#card)" stroke="#2f6fca"/>
    </g>

    <g fill="none" stroke="#4fd1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="132" y="135" width="66" height="45" rx="5"/>
      <path d="M147 193h36M165 180v13"/>
      <path d="M417 139h66v49h-66zM427 151h46M427 162h34M427 173h40"/>
      <circle cx="735" cy="160" r="30"/>
      <path d="M720 160l10 10 22-25"/>
      <path d="M982 148h38v51h-38zM1035 148h38v51h-38M1088 148h38v51h-38"/>
    </g>

    <g fill="#fff" font-size="18" font-weight="650">
      <text x="165" y="220">Dashboard local</text>
      <text x="450" y="220">Next.js API</text>
      <text x="735" y="220">Codex App Server</text>
      <text x="1028" y="220">Codex Home riêng</text>
    </g>
    <g fill="#91b7e7" font-size="13">
      <text x="165" y="242">127.0.0.1:3000</text>
      <text x="450" y="242">SQLite + lịch sử</text>
      <text x="735" y="242">JSONL qua stdio</text>
      <text x="1028" y="242">Một thư mục / tài khoản</text>
    </g>

    <g stroke="#4fd1ff" stroke-width="3" marker-end="url(#arrow)">
      <path d="M285 183H326"/>
      <path d="M570 183H611"/>
      <path d="M855 183H896"/>
    </g>
    <g fill="#72e5a7" font-size="13" font-weight="600">
      <text x="600" y="306">Không password · Không scraping · Không telemetry</text>
    </g>
  </g>
</svg>
